plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zenkai.naturegame'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'com.zenkai.naturegame'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    signingConfigs {
        release {
            storeFile file('game-release.jks')
            storePassword 'naturegame'
            keyAlias 'game'
            keyPassword 'naturegame'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    androidResources {
        noCompress 'pak', 'ntx'
    }
}
